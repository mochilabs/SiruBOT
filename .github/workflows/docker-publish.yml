name: Publish Docker Image

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  # Release: bot, dashboard, shardmanager, data-api, storage, notifier 전부 빌드
  build-and-push-image:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # 대시보드 NEXT_PUBLIC_* 변수를 production 환경 값으로 읽어요 (환경 변수가 없으면 저장소 변수로 폴백)
    environment: production
    strategy:
      matrix:
        app: [bot, dashboard, shardmanager, data-api, storage, notifier]
      fail-fast: false
    
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve cache reference
        id: cache
        # 레지스트리 참조는 소문자여야 해요. beta 빌드가 만든 캐시를 읽기 전용으로 재사용하고, 쓰기는 release 전용 태그에 해요.
        env:
          APP: ${{ matrix.app }}
        run: |
          BASE="${REGISTRY}/${GITHUB_REPOSITORY,,}-${APP}"
          echo "write=${BASE}:buildcache-release" >> "$GITHUB_OUTPUT"
          echo "beta=${BASE}:buildcache" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_HASH=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            VERSION=${{ github.event.release.tag_name }}
            SENTRY_RELEASE=${{ github.event.release.tag_name }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_DISCORD_CLIENT_ID=${{ vars.NEXT_PUBLIC_DISCORD_CLIENT_ID }}
            NEXT_PUBLIC_SUPPORT_SERVER=${{ vars.NEXT_PUBLIC_SUPPORT_SERVER }}
            NEXT_PUBLIC_TOS_URL=${{ vars.NEXT_PUBLIC_TOS_URL }}
            NEXT_PUBLIC_PRIVACY_POLICY_URL=${{ vars.NEXT_PUBLIC_PRIVACY_POLICY_URL }}
          cache-from: |
            type=registry,ref=${{ steps.cache.outputs.write }}
            type=registry,ref=${{ steps.cache.outputs.beta }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.write }},mode=max,image-manifest=true,oci-mediatypes=true
