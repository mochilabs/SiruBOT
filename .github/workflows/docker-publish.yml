name: Publish Docker Image

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  # Release: bot, dashboard, shardmanager, data-api 전부 빌드
  build-and-push-image:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [bot, dashboard, shardmanager, data-api]
      fail-fast: false

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_HASH=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            VERSION=${{ github.event.release.tag_name }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Record image digest
        env:
          APP: ${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/deployment-manifest.mjs image "$APP" "$DIGEST"

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.app }}
          path: .deploy/ci/${{ matrix.app }}.json
          include-hidden-files: true
          retention-days: 90
          overwrite: true

  deployment-manifest:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: .deploy/ci
      - name: Assemble successful deployment
        run: node scripts/deployment-manifest.mjs finalize
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest
          path: .deploy/ci/deployment-manifest.json
          include-hidden-files: true
          retention-days: 90
          overwrite: true
