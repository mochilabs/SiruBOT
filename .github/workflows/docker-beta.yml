name: Beta Docker Image

# beta 브랜치 push마다 빌드. 매 커밋 해시 태그 + 이동 태그 발행.
#   beta : beta, beta-<sha>
# PR(feat/**) 브랜치에서는 이미지를 빌드하지 않아요 — lint.yml의 타입체크(lint/typecheck/test)만 돌아요.
# 코드와 무관한 변경(문서 등)은 paths 필터에서 제외되어 빌드를 건너뛴다.
# 변경된 앱의 이미지만 빌드한다 (공유 패키지/Dockerfile 변경 시 전체 빌드).
on:
  push:
    branches: [beta]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'package.json'
      - 'yarn.lock'
      - 'turbo.json'
      - '.github/workflows/docker-beta.yml'
  workflow_dispatch:
    inputs:
      app:
        description: '빌드할 앱 선택 (all 선택 시 전체 빌드)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - bot
          - dashboard
          - shardmanager
          - data-api
          - storage
          - notifier
env:
  REGISTRY: ghcr.io

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bot: ${{ steps.filter.outputs.bot }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      shardmanager: ${{ steps.filter.outputs.shardmanager }}
      data-api: ${{ steps.filter.outputs.data-api }}
      storage: ${{ steps.filter.outputs.storage }}
      notifier: ${{ steps.filter.outputs.notifier }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed apps
        id: filter
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET="${{ inputs.app }}"
            echo "Manual trigger for target: $TARGET"
            set_app() {
              local name="$1"
              if [[ "$TARGET" == "all" || "$TARGET" == "$name" ]]; then
                echo "$name=true" >> "$GITHUB_OUTPUT"
              else
                echo "$name=false" >> "$GITHUB_OUTPUT"
              fi
            }
            set_app bot
            set_app dashboard
            set_app shardmanager
            set_app data-api
            set_app storage
            set_app notifier
            exit 0
          fi

          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [[ "$BASE" == "$ZERO_SHA" ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "Previous commit unavailable, building all apps"
            FILES=""
            FORCE_ALL=true
          else
            # Compare against the merge base so force-pushes and multi-commit updates
            # don't lose changes present in the new beta history.
            MERGE_BASE="$(git merge-base "$BASE" "$HEAD")"
            FILES="$(git diff --name-only "$MERGE_BASE" "$HEAD")"
            FORCE_ALL=false
          fi
          echo "Changed files:"
          echo "$FILES"
          check() {
            [[ "$FORCE_ALL" == true ]] || echo "$FILES" | grep -qE "$1"
          }
          SHARED='packages/|scripts/|Dockerfile|package\.json|yarn\.lock|turbo\.json'
          if check "^(apps/bot/|$SHARED)"; then BOT=true; else BOT=false; fi
          if check "^(apps/dashboard/|$SHARED)"; then DASHBOARD=true; else DASHBOARD=false; fi
          if check "^(apps/shardmanager/|$SHARED)"; then SHARD=true; else SHARD=false; fi
          if check "^(apps/data-api/|$SHARED)"; then DATAAPI=true; else DATAAPI=false; fi
          if check "^(apps/storage/|$SHARED)"; then STORAGE=true; else STORAGE=false; fi
          if check "^(apps/notifier/|$SHARED)"; then NOTIFIER=true; else NOTIFIER=false; fi
          echo "bot=$BOT" >> "$GITHUB_OUTPUT"
          echo "dashboard=$DASHBOARD" >> "$GITHUB_OUTPUT"
          echo "shardmanager=$SHARD" >> "$GITHUB_OUTPUT"
          echo "data-api=$DATAAPI" >> "$GITHUB_OUTPUT"
          echo "storage=$STORAGE" >> "$GITHUB_OUTPUT"
          echo "notifier=$NOTIFIER" >> "$GITHUB_OUTPUT"

  build-beta:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [bot, dashboard, shardmanager, data-api, storage, notifier]
      fail-fast: false

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        if: needs.changes.outputs[matrix.app] == 'true'
        uses: actions/checkout@v4

      - name: Resolve image tag prefix
        if: needs.changes.outputs[matrix.app] == 'true'
        id: tag
        # github.ref_name은 run: 블록 안에서 직접 치환하지 않아요 — 브랜치명에 셸 특수문자가 섞이면
        # 명령 주입이 됩니다. env:로만 넘겨 스크립트 안에서는 따옴표 감싼 변수로만 사용해요.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" == "beta" ]]; then
            PREFIX="beta"
          else
            # Docker 태그에는 '/' 가 올 수 없으므로 브랜치 slug로 치환
            PREFIX="$(echo "$REF_NAME" | tr '/' '-')"
          fi
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: needs.changes.outputs[matrix.app] == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: needs.changes.outputs[matrix.app] == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: needs.changes.outputs[matrix.app] == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.prefix }}
            type=sha,prefix=${{ steps.tag.outputs.prefix }}-,format=short

      - name: Build and push Docker image
        if: needs.changes.outputs[matrix.app] == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_HASH=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            VERSION=${{ steps.tag.outputs.prefix }}
            SENTRY_RELEASE=${{ steps.tag.outputs.prefix }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ steps.tag.outputs.prefix }}-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ steps.tag.outputs.prefix }}-${{ matrix.app }}
