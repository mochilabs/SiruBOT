name: Beta Docker Image

# beta 및 feat/** 브랜치 push마다 빌드. 매 커밋 해시 태그 + 이동 태그 발행.
#   beta : beta, beta-<sha> / feat 브랜치 : <branch-slug>, <branch-slug>-<sha>
# 코드와 무관한 변경(문서 등)은 paths 필터에서 제외되어 빌드를 건너뛴다.
# 변경된 앱의 이미지만 빌드한다 (공유 패키지/Dockerfile 변경 시 전체 빌드).
on:
  workflow_dispatch:
    inputs:
      full_build:
        description: "Build all apps and initialize/reset the deployment manifest"
        type: boolean
        default: false
  push:
    branches: [beta, "feat/**"]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "Dockerfile"
      - "package.json"
      - "yarn.lock"
      - "turbo.json"
      - ".dockerignore"
      - ".yarnrc.yml"
      - "tsconfig*.json"
      - "resources/**"
      - ".github/workflows/docker-beta.yml"

env:
  REGISTRY: ghcr.io

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      bot: ${{ steps.filter.outputs.bot }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      shardmanager: ${{ steps.filter.outputs.shardmanager }}
      data-api: ${{ steps.filter.outputs.data-api }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      # Compare with the last successful manifest, including changes from failed/cancelled runs.
      - name: Detect changed apps
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_FULL_BUILD: ${{ inputs.full_build || false }}
        run: node scripts/deployment-manifest.mjs prepare

      - name: Save build plan
        uses: actions/upload-artifact@v4
        with:
          name: deployment-plan
          path: .deploy/ci/plan.json
          include-hidden-files: true
          retention-days: 90
          overwrite: true

  build-beta:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [bot, dashboard, shardmanager, data-api]
      fail-fast: false

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        if: needs.changes.outputs[matrix.app] == 'true'
        uses: actions/checkout@v4

      - name: Resolve image tag prefix
        if: needs.changes.outputs[matrix.app] == 'true'
        id: tag
        run: |
          REF_NAME="${{ github.ref_name }}"
          if [[ "$REF_NAME" == "beta" ]]; then
            PREFIX="beta"
          else
            # Docker 태그에는 '/' 가 올 수 없으므로 브랜치 slug로 치환
            PREFIX="$(echo "$REF_NAME" | tr '/' '-')"
          fi
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: needs.changes.outputs[matrix.app] == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: needs.changes.outputs[matrix.app] == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: needs.changes.outputs[matrix.app] == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.prefix }}
            type=sha,prefix=${{ steps.tag.outputs.prefix }}-,format=short

      - name: Build and push Docker image
        id: build
        if: needs.changes.outputs[matrix.app] == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_HASH=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            VERSION=${{ steps.tag.outputs.prefix }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ steps.tag.outputs.prefix }}-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ steps.tag.outputs.prefix }}-${{ matrix.app }}

      - name: Set up Node.js for deployment tools
        if: needs.changes.outputs[matrix.app] == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Record image digest
        if: needs.changes.outputs[matrix.app] == 'true'
        env:
          APP: ${{ matrix.app }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/deployment-manifest.mjs image "$APP" "$DIGEST"

      - name: Save image digest
        if: needs.changes.outputs[matrix.app] == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.app }}
          path: .deploy/ci/${{ matrix.app }}.json
          include-hidden-files: true
          retention-days: 90
          overwrite: true

  deployment-manifest:
    needs: [changes, build-beta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: deployment-plan
          path: .deploy/ci
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: .deploy/ci
      - name: Assemble successful deployment
        run: node scripts/deployment-manifest.mjs finalize
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest
          path: .deploy/ci/deployment-manifest.json
          include-hidden-files: true
          retention-days: 90
          overwrite: true
