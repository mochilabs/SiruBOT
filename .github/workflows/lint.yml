name: Run lint

on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest 
    # 최소 권한 — PR 코드를 실행하는 워크플로라 GITHUB_TOKEN 권한을 contents:read로 제한해요.
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Enable Corepack and set Yarn version
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
 
      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'yarn'
 
      - name: Install dependencies
        run: yarn install --immutable
 
      - name: Run prettier
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test
