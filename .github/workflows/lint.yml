name: Run lint

on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest 

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Enable Corepack and set Yarn version
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
 
      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'yarn'
 
      - name: Install dependencies
        run: yarn install --immutable
 
      - name: Run prettier
        run: yarn lint

  deployment-tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js for deployment tools
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test deployment tools
        run: node --test scripts/deploy.test.mjs scripts/deployment-manifest.test.mjs scripts/deploy.compose.test.mjs
