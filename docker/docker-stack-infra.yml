services:
  redis:
    # 태그 고정: 플로팅 alpine 배포마다 버전이 굴러가 F-06(GETDEL) 판정·호환성이 흔들리지 않게 메이저 고정
    # 기존 컨테이너 실 버전은 redis-cli INFO server의 redis_version으로 확인 권장
    image: redis:8-alpine
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - sirubot-network
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  postgres:
    image: postgres:latest
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    networks:
      - sirubot-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

networks:
  sirubot-network:
    driver: overlay
    attachable: true
    name: sirubot-network

volumes:
  redis-data:
  postgres-data:
