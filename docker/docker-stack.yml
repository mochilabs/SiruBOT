services:
  # Application services
  bot:
    image: ghcr.io/mochilabs/sirubot-bot:beta
    env_file:
      - .env
    environment:
      LOGLEVEL: 3
      # 내부 데이터 게이트웨이 (미설정 시 봇이 외부 API를 직접 호출해요)
      DATA_API_URL: http://data-api:3002
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      - shardmanager
      - data-api
    networks:
      - sirubot-network
    # SIGTERM 후 Lavalink 세션/대기열 저장 등 유예 시간 (shutdown 단계가 30s 이내)
    stop_grace_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.role == manager

  shardmanager:
    image: ghcr.io/mochilabs/sirubot-shardmanager:beta
    env_file:
      - .env
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: 3001
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sirubot-network
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.role == manager

  dashboard:
    image: ghcr.io/mochilabs/sirubot-dashboard:beta
    env_file:
      - .env
    environment:
      HOSTNAME: "0.0.0.0"
      # 데이터 게이트웨이 관제 (/shards 페이지의 DataApiSection이 이 서버를 봐요)
      DATA_API_URL: http://data-api:3002
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - sirubot-network
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  # 외부 데이터 게이트웨이 — ohaasa/가사/날씨/챕터/택배 캐시 + LLM 배치(번역·기억정리)
  data-api:
    image: ghcr.io/mochilabs/sirubot-data-api:beta
    env_file:
      - .env
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: 3002
      # Redis 공유 캐시 (bot과 같은 인스턴스)
      REDIS_URL: ${REDIS_URL:?REDIS_URL required}
      # 번역·기억정리용 LLM (OPENAI_COMPATIBLE_API_URL/OPENAI_API_KEY는 .env에서)
      # 메모리 정리 잡: DATABASE_URL이 있을 때만 활성화돼요 (.env에서)
    ports:
      # 경고: data-api는 AUTH_KEY 헤더로 보호되지만, 외부에 직접 노출하면 무차별 대입/취약점 스캔에 노출된다.
      # 관제 대시보드(/dashboard)도 AUTH_KEY가 필요하다. 외부 공개가 필요 없으면 "127.0.0.1:3002:3002"로 제한할 것.
      - "3002:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sirubot-network
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.role == manager

  # 길드 에셋 스토리지 — 로컬 볼륨(무DB) 파일 저장소. 디스코드가 임베드로 fetch하는 공개 URL을 발급해요.
  storage:
    image: ghcr.io/mochilabs/sirubot-storage:beta
    env_file:
      - .env
    environment:
      PORT: 3003
      # 에셋 저장소 — 컨테이너 /data를 named volume으로 영속화 (무DB, 파일 저장)
      STORAGE_DATA_DIR: /data
      # 필수: 디스코드가 임베드로 fetch하는 https 공개 주소 — 실제 공개 도메인으로 교체
      # (발급 URL 스냅샷이라 도메인 변경 시 기존 에셋 URL 일괄 치환이 필요해요)
      STORAGE_PUBLIC_URL: https://cdn.example.com
    ports:
      # 공개 GET(임베드 fetch)이 외부에서 도달해야 하므로 포트 노출이 필요해요.
      # 업로드/삭제 API는 STORAGE_AUTH_KEY ?? AUTH_KEY 헤더로 보호돼요.
      - "3003:3003"
    volumes:
      # 로컬 볼륨 — placement를 manager로 고정해 두어 스웜 재배포 시에도 같은 노드의 데이터가 유지돼요.
      - storage-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - sirubot-network
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: stop-first
      placement:
        constraints:
          - node.role == manager

networks:
  sirubot-network:
    external: true

volumes:
  storage-data:
